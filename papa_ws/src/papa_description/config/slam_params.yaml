slam_toolbox:
  ros__parameters:
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    mode: mapping
    max_laser_range: 10.0
    resolution: 0.05
    transform_timeout: 2.0  

    # =======================================================
    # LIFELONG MAPPING (MAPAS ACTUALIZABLES)
    # Si quieres continuar un mapa anterior, quita el "#"
    # de las dos líneas de abajo y pon la ruta sin el .posegraph
    # =======================================================
    #map_file_name: "/home/perez_010/papa/Mappeo/mapa_maestro"
    #map_start_pose: [0.0, 0.0, 0.0]

    # --- PENALIZACIONES ---
    minimum_travel_distance: 0.3
    minimum_travel_heading: 0.5
    correlation_search_space_dimension: 0.3
    correlation_search_space_resolution: 0.01
    distance_variance_penalty: 0.5   
    angle_variance_penalty: 1.5
